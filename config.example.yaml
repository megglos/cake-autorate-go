# cake-autorate-go configuration
#
# This is a Go rewrite of cake-autorate:
#   https://github.com/lynxthecat/cake-autorate
#
# Adjust these values to match your network setup.
# Run `cake-autorate-go --defaults` to see all defaults.

# -- Link Configuration -------------------------------------------------------
# Each link represents a WAN connection with download/upload interface pair,
# its own reflectors, and optional ping binding for multi-WAN routing.
#
# Multiple links run concurrently in a single process -- no need to spawn
# separate instances like the bash version requires.
#
# For backward compatibility, you can also use the legacy flat format
# (download:/upload:/reflectors: at top level) for single-WAN setups.

links:
  - name: primary
    download:
      interface: ifb4eth1      # Download interface (often ifb-wan on OpenWrt)
      adjust: true             # Enable dynamic download rate adjustment
      min_rate_kbps: 25000     # Minimum download bandwidth (kbit/s)
      base_rate_kbps: 200000   # Steady-state download bandwidth (kbit/s)
      max_rate_kbps: 200000    # Maximum download bandwidth (kbit/s)
      owd_delta_delay_thr_ms: 30.0               # OWD delta threshold for bufferbloat detection (ms)
      avg_owd_delta_max_adjust_up_thr_ms: 10.0   # Max avg delta to still increase rate (ms)
      avg_owd_delta_max_adjust_down_thr_ms: 60.0 # Max avg delta for maximum rate decrease (ms)
    upload:
      interface: eth1          # Upload interface
      adjust: true
      min_rate_kbps: 25000
      base_rate_kbps: 35000
      max_rate_kbps: 35000
      owd_delta_delay_thr_ms: 30.0
      avg_owd_delta_max_adjust_up_thr_ms: 10.0
      avg_owd_delta_max_adjust_down_thr_ms: 60.0
    # Reflectors of this link. If you do not set them, the link uses the
    # top-level reflectors, or the default list for the ping_method. With
    # ping_method icmp-timestamp, use only reflectors that reply to timestamp
    # requests (see docs/configuration.md, "Ping method").
    # reflectors:
    #   - 1.1.1.1
    #   - 8.8.8.8
    #   - 9.9.9.9
    # ping_interface: wan       # Bind ICMP socket to this interface (SO_BINDTODEVICE)
    # ping_source_addr: 0.0.0.0 # Source IP address for ICMP packets
    # A link can override these top-level keys. A key that the link does not
    # set uses the top-level value.
    # ping_method: icmp-timestamp
    # pinger_count: 4
    # ping_interval_ms: 300
    # learn_cross_delay: true

  # -- Second WAN (uncomment to enable) ----------------------------------------
  # - name: secondary
  #   download:
  #     interface: ifb4eth2
  #     adjust: true
  #     min_rate_kbps: 5000
  #     base_rate_kbps: 50000
  #     max_rate_kbps: 100000
  #     owd_delta_delay_thr_ms: 30.0
  #     avg_owd_delta_max_adjust_up_thr_ms: 10.0
  #     avg_owd_delta_max_adjust_down_thr_ms: 60.0
  #   upload:
  #     interface: eth2
  #     adjust: true
  #     min_rate_kbps: 5000
  #     base_rate_kbps: 10000
  #     max_rate_kbps: 20000
  #     owd_delta_delay_thr_ms: 30.0
  #     avg_owd_delta_max_adjust_up_thr_ms: 10.0
  #     avg_owd_delta_max_adjust_down_thr_ms: 60.0
  #   reflectors:
  #     - 1.0.0.1
  #     - 8.8.4.4
  #     - 9.9.9.9
  #   ping_interface: wan2
  #   ping_source_addr: 0.0.0.0

# -- Shared Settings ----------------------------------------------------------
# These apply to all links.

pinger_count: 6             # Number of reflectors to ping simultaneously
ping_interval_ms: 300       # Interval between pings per reflector (ms)
# ping_method: "icmp" (ICMP echo, RTT/2 for each direction) or
# "icmp-timestamp" (ICMP timestamps, delay of each direction). With
# "icmp-timestamp", the reflectors must reply to timestamp requests. If you do
# not set reflectors, the program uses a list of reflectors that reply
# (AdGuard DNS, Vultr, Hetzner).
ping_method: icmp

# -- Idle/Sleep Settings ------------------------------------------------------

enable_sleep_function: true
connection_active_thr_kbps: 2000  # Below this, connection is considered idle
sustained_idle_sleep_thr_s: 60.0  # Seconds of idle before entering sleep state

# -- Bufferbloat Detection ----------------------------------------------------

bufferbloat_detection_window: 6   # Number of samples in detection window
bufferbloat_detection_thr: 3      # Samples exceeding threshold to trigger detection

# -- EWMA Parameters ----------------------------------------------------------
# These control how quickly baselines and averages respond to changes.

alpha_baseline_increase: 0.001    # Baseline moves slowly when delay increases
alpha_baseline_decrease: 0.9      # Baseline tracks quickly when delay decreases
alpha_delta_ewma: 0.095           # Not used (kept for config compatibility)

# -- Rate Adjustment Factors ---------------------------------------------------

shaper_rate_min_adjust_down_bufferbloat: 0.99  # Minimum rate decrease on bufferbloat
shaper_rate_max_adjust_down_bufferbloat: 0.75  # Maximum rate decrease on bufferbloat
shaper_rate_min_adjust_up_load_high: 1.0       # Minimum rate increase on high load
shaper_rate_max_adjust_up_load_high: 1.04      # Maximum rate increase on high load
shaper_rate_adjust_down_load_low: 0.99         # Rate decay factor (rate > base)
shaper_rate_adjust_up_load_low: 1.01           # Rate recovery factor (rate < base)

high_load_thr: 0.75               # Load threshold considered "high" (0.0-1.0)

# -- Timing -------------------------------------------------------------------

monitor_interval_ms: 200                  # How often to check interface throughput
bufferbloat_refractory_period_ms: 300     # Minimum time between rate increases after BB
refractory_on_decrease: false             # true: also only one rate decrease in each refractory period
repeat_decrease_on_rise: false            # true: a second decrease in the refractory period only when the delay increases
learn_cross_delay: false                  # true: ignore the upload delay from download activity (icmp-timestamp only)
decay_refractory_period_ms: 1000          # Minimum time between decay adjustments

# -- Reflector Health ---------------------------------------------------------

reflector_response_deadline_s: 1.0
reflector_misbehaving_detection_window: 60
reflector_misbehaving_detection_thr: 3

# -- Stall Detection ----------------------------------------------------------

stall_detection_thr: 5
connection_stall_thr_kbps: 10
global_ping_response_timeout_s: 10.0

# -- Miscellaneous ------------------------------------------------------------

min_shaper_rates_enforcement: false   # Enforce min rates during idle/stall
startup_wait_s: 0.0                   # Delay before starting (seconds)

# -- Logging ------------------------------------------------------------------

log_to_file: true
log_file_path: /var/log/cake-autorate.log
log_file_max_size_kb: 2000
debug: false

# Status of all links as JSON, written each second. Empty: no status file.
# status_file: /var/run/cake-autorate/status.json

# Unix socket for the commands pause, resume and list (see docs/configuration.md, "Control socket").
# Empty: no control socket.
# control_socket: /var/run/cake-autorate/control.sock
