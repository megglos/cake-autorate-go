name: OpenWrt

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  # Test the UCI converter with ucode, built from source.
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build ucode
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libjson-c-dev
          git clone --depth 1 https://github.com/jow-/ucode.git "$RUNNER_TEMP/ucode"
          cmake -S "$RUNNER_TEMP/ucode" -B "$RUNNER_TEMP/ucode/build" \
            -DFS_SUPPORT=ON -DMATH_SUPPORT=OFF -DNL80211_SUPPORT=OFF -DRESOLV_SUPPORT=OFF \
            -DRTNL_SUPPORT=OFF -DSTRUCT_SUPPORT=OFF -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF \
            -DULOOP_SUPPORT=OFF -DDEBUG_SUPPORT=OFF -DLOG_SUPPORT=OFF -DSOCKET_SUPPORT=OFF \
            -DZLIB_SUPPORT=OFF -DDIGEST_SUPPORT=OFF
          make -C "$RUNNER_TEMP/ucode/build" -j"$(nproc)"
          sudo make -C "$RUNNER_TEMP/ucode/build" install
          sudo ldconfig

      - name: Test the converter
        working-directory: openwrt/cake-autorate-go
        run: ucode -L "$PWD/files/*.uc" tests/convert_test.uc files

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The program must accept the output of the converter.
      - name: Check a converted configuration with the program
        run: |
          ucode -L "$PWD/openwrt/cake-autorate-go/files/*.uc" openwrt/cake-autorate-go/tests/sample.uc openwrt/cake-autorate-go/files > "$RUNNER_TEMP/sample.yaml"
          go run . -check-config -strict -config "$RUNNER_TEMP/sample.yaml"

      - name: Check the syntax of the LuCI views
        run: |
          find openwrt/luci-app-cake-autorate-go/htdocs -name '*.js' -print0 | xargs -0 -n1 node --check
          for f in openwrt/luci-app-cake-autorate-go/root/usr/share/*/*/*.json; do
            jq empty "$f"
          done

  # Build the apk packages with the OpenWrt SDK, one job for each
  # architecture. The VM tests need only x86_64; the aarch64 build takes
  # much longer and runs at the same time.
  # The packages build at the same time as the converter tests; the
  # release job publishes them only after these tests passed.
  # The SDK version is the OpenWrt version of the VM (scripts/openwrt-vm.sh).
  package-x86:
    uses: ./.github/workflows/package.yml
    with:
      arch: x86_64-openwrt-25.12
      sdk: x86_64-25.12.5
      goarch: amd64

  # Not for pull requests: the CI workflow already builds the program for
  # arm64, and the package files are the same for all architectures. The
  # runs on main and the releases build it.
  package-arm:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/package.yml
    with:
      arch: aarch64_cortex-a53-openwrt-25.12
      sdk: aarch64_cortex-a53-25.12.5
      goarch: arm64

  # Install the x86_64 packages in an OpenWrt VM and test the service:
  # start, status file, control socket, reload, invalid configuration, stop.
  # Then test the LuCI page in a browser (Playwright).
  # Each matrix job starts its own VM: the tests change the state of the
  # VM (configuration, service, rpcd), thus they cannot share a VM. The
  # browser tests are split in shards; in a shard, they run one after the
  # other, as on a local run.
  # Each VM job tests the packages of the job package-x86, thus the tests
  # use the same files as the release.
  vm:
    needs: package-x86
    # Playwright 1.56 has no Chromium for Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        part: [service, 1/8, 2/8, 3/8, 4/8, 5/8, 6/8, 7/8, 8/8]
    name: vm (${{ matrix.part }})
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The download of the QEMU packages from the Ubuntu mirror can take
      # some minutes. Thus the cache keeps the packages for each runner
      # image: with the same image, the packages fit the installed ones.
      # ImageOS and ImageVersion are shell variables of the runner, not
      # values of the env context.
      - name: Find the runner image
        id: image
        run: echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore the QEMU packages
        uses: actions/cache@v6
        with:
          path: ~/qemu-debs
          key: qemu-debs-${{ steps.image.outputs.id }}

      - name: Install QEMU
        run: |
          # If the packages from the cache do not install, apt-get downloads
          # them again.
          if ls ~/qemu-debs/*.deb >/dev/null 2>&1 && sudo dpkg -i ~/qemu-debs/*.deb; then
            exit 0
          fi
          sudo apt-get update
          mkdir -p ~/qemu-debs/partial
          sudo apt-get install -y --no-install-recommends -f \
            -o Dir::Cache::archives="$HOME/qemu-debs" qemu-system-x86 qemu-utils
          sudo rm -rf ~/qemu-debs/partial ~/qemu-debs/lock
          sudo chown -R "$USER" ~/qemu-debs

      - uses: actions/setup-node@v7
        if: matrix.part != 'service'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openwrt/luci-app-cake-autorate-go/tests/package-lock.json

      # The browser needs Ubuntu packages from the same mirror. The cache
      # also keeps the browser (ms-playwright): Playwright does not download
      # a browser that it has. The key has package-lock.json, thus a new
      # Playwright version gets a new entry. The job vm (service) has no
      # browser, thus this cache has its own key.
      - name: Restore the browser and its packages
        if: matrix.part != 'service'
        uses: actions/cache@v6
        with:
          path: |
            ~/browser-debs
            ~/.cache/ms-playwright
          key: browser-${{ steps.image.outputs.id }}-${{ hashFiles('openwrt/luci-app-cake-autorate-go/tests/package-lock.json') }}

      - name: Install the browser for the LuCI tests
        if: matrix.part != 'service'
        working-directory: openwrt/luci-app-cake-autorate-go/tests
        run: |
          npm ci
          # Playwright runs apt-get update and apt-get install. With this
          # directory, apt-get does not download the packages that are in
          # the cache.
          mkdir -p ~/browser-debs/partial
          echo "Dir::Cache::archives \"$HOME/browser-debs\";" | sudo tee /etc/apt/apt.conf.d/99browser-debs
          npx playwright install --with-deps chromium
          sudo rm -f /etc/apt/apt.conf.d/99browser-debs ~/browser-debs/lock
          sudo rm -rf ~/browser-debs/partial
          sudo chown -R "$USER" ~/browser-debs

      - name: Get the packages of package-x86
        uses: actions/download-artifact@v8
        with:
          name: openwrt-x86_64-openwrt-25.12
          path: packages

      - name: Start the VM and install the package
        run: |
          scripts/openwrt-vm.sh start
          scripts/openwrt-vm.sh install packages/*.apk
          # The dependencies of the packages are installed (the pin of the
          # link uses conntrack).
          scripts/openwrt-vm.sh ssh 'command -v conntrack'

      # The VM must finish its start (the WAN gets its address by DHCP)
      # before the browser tests: the start changes the network. Before the
      # shards, the service test ran first and gave this time.
      - name: Wait until the VM is ready
        if: matrix.part != 'service'
        run: |
          for i in $(seq 60); do
            if scripts/openwrt-vm.sh ssh 'ifstatus wan | jsonfilter -e "@.up" | grep -qx true'; then
              sleep 10
              exit 0
            fi
            sleep 2
          done
          echo "the WAN of the VM is not up" >&2
          exit 1

      - name: Test the service
        if: matrix.part == 'service'
        run: scripts/openwrt-vm-test.sh

      # --fully-parallel splits the shards by test, not by file. With one
      # worker, the tests of a shard still run one after the other.
      - name: Test the LuCI app in a browser
        if: matrix.part != 'service'
        working-directory: openwrt/luci-app-cake-autorate-go/tests
        run: npx playwright test --fully-parallel --shard=${{ matrix.part }}

      - name: Get the state of the VM
        if: failure() && matrix.part != 'service'
        run: |
          mkdir -p openwrt/luci-app-cake-autorate-go/tests/test-results
          scripts/openwrt-vm.sh ssh 'uptime; tc qdisc show; ifstatus wan; logread' \
            > openwrt/luci-app-cake-autorate-go/tests/test-results/vm-state.txt 2>&1 || true

      - name: Store the browser test results
        if: failure() && matrix.part != 'service'
        uses: actions/upload-artifact@v7
        with:
          name: luci-test-results-${{ strategy.job-index }}
          path: openwrt/luci-app-cake-autorate-go/tests/test-results
          if-no-files-found: ignore

      - name: Stop the VM
        if: always()
        run: scripts/openwrt-vm.sh stop

  # Attach the packages to the release, only after all tests passed.
  release:
    if: github.event_name == 'release'
    needs: [converter, package-x86, package-arm, vm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: openwrt-*
          path: dist
          merge-multiple: true

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.apk -R "${{ github.repository }}"
