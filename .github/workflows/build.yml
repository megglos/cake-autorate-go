name: CI

on:
  push:
    branches: [main, master]
  # Run on all pull requests, also on pull requests that target other
  # branches (stacked pull requests).
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v -race -count=1 ./...

      # OpenWrt also runs on 32-bit targets: the code and the tests must
      # build there.
      - name: Vet for 32 bit
        run: GOARCH=386 go vet ./...

      # Show the baseline comparison, the simulator scorecard and the known
      # issues in the job summary. This step also runs when the tests fail.
      - name: Simulator scorecard
        if: ${{ !cancelled() }}
        run: |
          SIM_BASELINE_OUT=baseline.md go test -count=1 -run TestSimBaseline . > /dev/null || true
          SIM_SCORECARD_OUT=scorecard.txt go test -count=1 -v -run 'TestSimScorecard|TestKnownIssue' . > sim.log
          {
            echo '## Simulator baseline comparison'
            echo 'To accept new scores, run `go test -run TestSimBaseline -update` and commit `testdata/sim_baseline.json`.'
            echo
            cat baseline.md 2>/dev/null || echo 'No comparison. Look at the test log.'
            echo '## Simulator scorecard'
            echo '```'
            cat scorecard.txt
            echo '```'
            echo '## Known issues'
            echo 'With the default config. Each issue tells its status and the options that fix it, if there are any.'
            grep -o 'known issue .*' sim.log | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  # Test the real binary with the real CAKE qdisc on an emulated link in
  # network namespaces (scripts/ci-emulation.sh).
  emulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o cake-autorate-go .

      - name: Install the tools and the kernel modules
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q iperf3 ethtool "linux-modules-extra-$(uname -r)" || sudo apt-get install -y -q iperf3 ethtool
          for m in sch_cake sch_netem sch_tbf ifb act_mirred; do sudo modprobe "$m"; done

      # fping for cake-autorate: the Ubuntu package (5.1) has no
      # --icmp-timestamp (pinger_method=fping-ts).
      - name: Build fping
        run: |
          curl -sSfLO https://github.com/schweikert/fping/releases/download/v5.5/fping-5.5.tar.gz
          echo "15c4e32b6c55ff105bafe03e8c91c7ca1b2eda31bf9a7127326bb87887ee18fe  fping-5.5.tar.gz" | sha256sum -c -
          tar xzf fping-5.5.tar.gz
          (cd fping-5.5 && ./configure -q && make -s && sudo make -s install)
          rm -rf fping-5.5 fping-5.5.tar.gz
          fping -v

      # The original cake-autorate for the comparison phase, at a fixed
      # commit: a new upstream version does not change the result.
      - uses: actions/checkout@v4
        with:
          repository: lynxthecat/cake-autorate
          ref: ac75f49348c2ce697e698270a340d42e499cd953
          path: upstream

      - name: Emulation test
        run: sudo ./scripts/ci-emulation.sh -o ci-emu -U upstream

      - name: Result
        if: ${{ !cancelled() }}
        run: |
          {
            echo '## Emulation test'
            echo '```'
            cat ci-emu/result.txt 2>/dev/null || echo 'No result. Look at the test log.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ci-emulation
          path: ci-emu/

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64
            name: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          go build -ldflags="-s -w -X main.version=${VERSION}" -o cake-autorate-go-${{ matrix.name }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cake-autorate-go-${{ matrix.name }}
          path: cake-autorate-go-${{ matrix.name }}
