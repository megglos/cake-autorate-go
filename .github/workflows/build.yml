name: CI

on:
  push:
    branches: [main, master]
  # Run on all pull requests, also on pull requests that target other
  # branches (stacked pull requests).
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v -race -count=1 ./...

      # Show the simulator scorecard and the known issues in the job summary.
      - name: Simulator scorecard
        run: |
          SIM_SCORECARD_OUT=scorecard.txt go test -count=1 -v -run 'TestSimScorecard|TestKnownIssue' . > sim.log
          {
            echo '## Simulator scorecard'
            echo '```'
            cat scorecard.txt
            echo '```'
            echo '## Known issues'
            grep -o 'known issue .*' sim.log | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64
            name: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          go build -ldflags="-s -w -X main.version=${VERSION}" -o cake-autorate-go-${{ matrix.name }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cake-autorate-go-${{ matrix.name }}
          path: cake-autorate-go-${{ matrix.name }}
